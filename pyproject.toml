[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "classical-absa"
version = "0.1.0"
description = "A tested classical pipeline for aspect extraction, opinion linking and product-level sentiment summaries."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2.0,<3",
  "pandas>=2.2,<3",
  "spacy>=3.8,<3.9",
  "scikit-learn>=1.5,<2",
  "sklearn-crfsuite>=0.5,<0.6",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = [
  "jupyter>=1.1,<2",
  "nbclient>=0.10,<1",
  "nbformat>=5.10,<6",
  "pytest>=8.3,<10",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
